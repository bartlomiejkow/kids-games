<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #6dd5ed, #2193b0);
    color: white;
    text-align: center;
}

header {
    padding: 15px;
}

h1 {
    margin: 5px;
    font-size: 42px;
}

.back {
    position: absolute;
    left: 20px;
    top: 20px;
    color: white;
    text-decoration: none;
    font-size: 28px;
}

.players {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 15px;
}

.player {
    background: rgba(255,255,255,.25);
    padding: 12px 25px;
    border-radius: 15px;
    font-size: 20px;
    transition: .2s;
}

.player.active {
    background: white;
    color: #2193b0;
    transform: scale(1.08);
}

.board {
    max-width: 650px;
    margin: 20px auto;
    padding: 15px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.card {
    aspect-ratio: 1;
    cursor: pointer;
    perspective: 700px;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform .45s;
    transform-style: preserve-3d;
}

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}

.front,
.back-card {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 18px;

    display: flex;
    justify-content: center;
    align-items: center;

    backface-visibility: hidden;

    box-shadow: 0 5px 12px rgba(0,0,0,.25);
}

.front {
    background: white;
    color: #2193b0;
    font-size: 45px;
}

.back-card {
    background: #fff7d6;
    transform: rotateY(180deg);
    font-size: clamp(38px, 7vw, 65px);
}

.matched .back-card {
    background: #c8ffc8;
}

button {
    border: none;
    border-radius: 15px;
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
    margin-bottom: 25px;
}

.message {
    min-height: 35px;
    font-size: 26px;
    font-weight: bold;
}

@media (max-width: 600px) {
    .board {
        gap: 8px;
        padding: 10px;
    }

    h1 {
        font-size: 32px;
    }

    .players {
        gap: 8px;
    }

    .player {
        padding: 10px;
        font-size: 16px;
    }
}
</style>
</head>

<body>

<a class="back" href="/">⬅️</a>

<header>
    <h1>🧠 Memory</h1>
</header>

<div class="players">
    <div id="player0" class="player active">
        👧 Gracz 1: <strong id="score0">0</strong>
    </div>

    <div id="player1" class="player">
        👦 Gracz 2: <strong id="score1">0</strong>
    </div>
</div>

<div id="message" class="message">
    Ruch gracza 1
</div>

<div id="board" class="board"></div>

<button onclick="startGame()">🔄 Nowa gra</button>

<script>

const symbols = [
    "🐶", "🐱", "🦊", "🐸",
    "🐼", "🦁", "🐵", "🐧"
];

let cards = [];
let firstCard = null;
let secondCard = null;
let locked = false;

let currentPlayer = 0;
let scores = [0, 0];
let matchedPairs = 0;


function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
            [array[j], array[i]];
    }

    return array;
}


function startGame() {

    scores = [0, 0];
    currentPlayer = 0;
    matchedPairs = 0;

    firstCard = null;
    secondCard = null;
    locked = false;

    document.getElementById("score0").textContent = 0;
    document.getElementById("score1").textContent = 0;

    cards = shuffle([...symbols, ...symbols]);

    const board = document.getElementById("board");
    board.innerHTML = "";

    cards.forEach((symbol, index) => {

        const card = document.createElement("div");

        card.className = "card";
        card.dataset.symbol = symbol;
        card.dataset.index = index;

        card.innerHTML = `
            <div class="card-inner">

                <div class="front">
                    ❓
                </div>

                <div class="back-card">
                    ${symbol}
                </div>

            </div>
        `;

        card.addEventListener("click", () => flipCard(card));

        board.appendChild(card);
    });

    updatePlayer();
}


function flipCard(card) {

    if (locked) return;
    if (card.classList.contains("flipped")) return;
    if (card.classList.contains("matched")) return;

    card.classList.add("flipped");

    if (!firstCard) {
        firstCard = card;
        return;
    }

    secondCard = card;
    locked = true;

    checkPair();
}


function checkPair() {

    if (
        firstCard.dataset.symbol ===
        secondCard.dataset.symbol
    ) {

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");

        scores[currentPlayer]++;
        matchedPairs++;

        document.getElementById(
            "score" + currentPlayer
        ).textContent = scores[currentPlayer];

        resetCards();

        if (matchedPairs === symbols.length) {
            finishGame();
        }

    } else {

        setTimeout(() => {

            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");

            currentPlayer =
                currentPlayer === 0 ? 1 : 0;

            resetCards();

            updatePlayer();

        }, 900);
    }
}


function resetCards() {
    firstCard = null;
    secondCard = null;
    locked = false;
}


function updatePlayer() {

    document.getElementById("player0")
        .classList.toggle(
            "active",
            currentPlayer === 0
        );

    document.getElementById("player1")
        .classList.toggle(
            "active",
            currentPlayer === 1
        );

    document.getElementById("message")
        .textContent =
            "Ruch gracza " + (currentPlayer + 1);
}


function finishGame() {

    let text;

    if (scores[0] > scores[1]) {
        text = "🎉 Wygrywa Gracz 1!";
    }
    else if (scores[1] > scores[0]) {
        text = "🎉 Wygrywa Gracz 2!";
    }
    else {
        text = "🤝 Remis!";
    }

    document.getElementById("message")
        .textContent = text;
}


startGame();

</script>

</body>
</html>
