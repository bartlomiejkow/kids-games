services:
  web-serwer:
    image: nginx:latest
    container_name: moj-test-nginx
    ports:
      - "8001:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - memory-server
    restart: unless-stopped
  memory-server:
    build: ./memory-server
    restart: unless-stopped
